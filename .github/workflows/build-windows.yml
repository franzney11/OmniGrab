name: Build OmniGrab for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-desktop.txt
      - name: Build desktop application
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name OmniGrab
          --collect-all yt_dlp
          --collect-all imageio_ffmpeg
          --collect-all webview
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all starlette
          --collect-all pydantic
          --add-data "frontend;frontend"
          desktop_main.py
      - name: Create installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer/OmniGrab.iss
          options: /O+ /DMyAppVersion=${{ github.ref_name }}
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OmniGrab-Windows
          path: |
            Output/OmniGrab-Setup.exe
            dist/OmniGrab/**
