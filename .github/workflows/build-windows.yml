name: Build OmniGrab for Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-desktop.txt
      - name: Set application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path version.txt -Value $version -NoNewline
      - name: Build desktop application
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name OmniGrab
          --icon "omnigrab-icon.ico"
          --add-data "omnigrab-icon.png;."
          --collect-all yt_dlp
          --collect-all imageio_ffmpeg
          --collect-all webview
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all starlette
          --collect-all pydantic
          --collect-all curl_cffi
          --add-data "frontend;frontend"
          --add-data "version.txt;."
          desktop_main.py
      - name: Create installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer/OmniGrab.iss
          options: /O+ /DMyAppVersion=${{ github.ref_name }}
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OmniGrab -DestinationPath OmniGrab-Portable.zip -CompressionLevel Optimal
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OmniGrab-Windows
          path: |
            Output/OmniGrab-Setup.exe
            OmniGrab-Portable.zip
            dist/OmniGrab/**
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OmniGrab ${{ github.ref_name }}
          body: |
            ## OmniGrab ${{ github.ref_name }}

            ### Windows downloads
            - **OmniGrab-Setup.exe** - Installer
            - **OmniGrab-Portable.zip** - Portable version

            OmniGrab requires Windows 10 or 11 x64 and Microsoft Edge WebView2.
          files: |
            Output/OmniGrab-Setup.exe
            OmniGrab-Portable.zip
